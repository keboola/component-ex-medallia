[project]
name = "ex-medallia"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "dateparser>=1.4.1",
    "keboola-component>=1.10.0",
    "pydantic>=2.11.7",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    # scrub_before_read (applied at record time so expected/ is synthetic, never real data)
    # is a keboola.vcr 0.7.0 feature; datadirtest only floors it at 0.5.0, so pin it here.
    "keboola.vcr>=0.7.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.24"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
